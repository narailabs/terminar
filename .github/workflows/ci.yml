name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust Tests & Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            server/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: server
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: server
        run: cargo clippy -- -D warnings

      - name: Run unit tests
        working-directory: server
        run: cargo test 2>&1 | tee rust-test-output.txt

      - name: Run integration tests (ignored)
        working-directory: server
        run: cargo test -- --ignored 2>&1 | tee rust-integration-output.txt
        continue-on-error: true

      - name: Upload Rust test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-results
          path: |
            server/rust-test-output.txt
            server/rust-integration-output.txt

  typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies (shell-protocol)
        working-directory: packages/shell-protocol
        run: pnpm install

      - name: Test shell-protocol
        working-directory: packages/shell-protocol
        run: pnpm test 2>&1 | tee shell-protocol-test-output.txt
        continue-on-error: true

      - name: Install dependencies (web)
        working-directory: web
        run: pnpm install

      - name: Test web
        working-directory: web
        run: pnpm test 2>&1 | tee web-test-output.txt
        continue-on-error: true

      - name: Install dependencies (extension)
        working-directory: extension
        run: pnpm install

      - name: Test extension
        working-directory: extension
        run: pnpm test 2>&1 | tee extension-test-output.txt
        continue-on-error: true

      - name: Upload TypeScript test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-test-results
          path: |
            packages/shell-protocol/shell-protocol-test-output.txt
            web/web-test-output.txt
            extension/extension-test-output.txt

  build:
    name: Build All Artifacts
    runs-on: ubuntu-latest
    needs: [rust, typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            server/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}

      - name: Build Rust server (release)
        working-directory: server
        run: cargo build --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build shell-protocol
        working-directory: packages/shell-protocol
        run: |
          pnpm install
          pnpm build

      - name: Build web client
        working-directory: web
        run: |
          pnpm install
          pnpm build

      - name: Build extension
        working-directory: extension
        run: |
          pnpm install
          pnpm run compile

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            server/target/release/terminar-server
            web/dist/
            extension/out/
