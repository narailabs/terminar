name: Release

on:
  push:
    tags:
      - 'v*'

defaults:
  run:
    working-directory: apps/terminar

permissions:
  contents: write

jobs:
  build-server:
    name: Build Server (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: terminar-server
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: terminar-server
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: terminar-server
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: terminar-server
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: terminar-server.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/terminar/server/target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('apps/terminar/server/Cargo.lock') }}

      - name: Build server (release)
        working-directory: apps/terminar/server
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: apps/terminar/server/target/${{ matrix.target }}/release/${{ matrix.artifact }}

  build-electron:
    name: Build Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build-server
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: apps/terminar/server/target/release/
          merge-multiple: true

      - name: Install dependencies
        working-directory: apps/terminar/electron
        run: pnpm install

      - name: Build Electron app
        working-directory: apps/terminar/electron
        run: pnpm build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.platform }}
          path: |
            apps/terminar/electron/release/*.dmg
            apps/terminar/electron/release/*.zip
            apps/terminar/electron/release/*.AppImage
            apps/terminar/electron/release/*.deb
            apps/terminar/electron/release/*.snap
            apps/terminar/electron/release/*.exe
            apps/terminar/electron/release/*.msi

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-server, build-electron]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
