name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-server:
    name: Build Server (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: terminar-server
            npm_pkg: linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: terminar-server
            npm_pkg: linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: terminar-server
            npm_pkg: darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: terminar-server
            npm_pkg: darwin-arm64
          # Windows support deferred — server requires Unix sockets
          # - os: windows-latest
          #   target: x86_64-pc-windows-msvc
          #   artifact: terminar-server.exe
          #   npm_pkg: win32-x64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          # Add arm64 sources without breaking existing amd64 sources
          cat /etc/apt/sources.list.d/*.sources 2>/dev/null | grep -q Architectures || true
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs) main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64-ports.list
          sudo apt-get update || true
          sudo apt-get install -y gcc-aarch64-linux-gnu libpam0g-dev:arm64

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            server/target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('server/Cargo.lock') }}

      - name: Build server (release)
        working-directory: server
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          RUSTFLAGS: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '-L /usr/lib/aarch64-linux-gnu' || '' }}

      - name: Sign macOS binary (ad-hoc)
        if: runner.os == 'macOS'
        working-directory: server
        run: codesign --force --sign - target/${{ matrix.target }}/release/terminar-server

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: server/target/${{ matrix.target }}/release/${{ matrix.artifact }}

  build-tray:
    name: Build Tray App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: tray
        run: pnpm install

      - name: Build tray app (Vite only)
        working-directory: tray
        run: pnpm build

      - name: Upload tray build
        uses: actions/upload-artifact@v4
        with:
          name: tray-build
          path: |
            tray/dist/
            tray/dist-electron/
            tray/icons/
            tray/package.json

  assemble-npm:
    name: Assemble npm Packages
    runs-on: ubuntu-latest
    needs: [build-server, build-tray]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get version from root package.json
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Download server binaries
        uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: artifacts/server

      - name: Download tray build
        uses: actions/download-artifact@v4
        with:
          name: tray-build
          path: artifacts/tray

      - name: Assemble platform packages
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Map Rust targets to npm package directories
          declare -A TARGET_MAP=(
            ["x86_64-unknown-linux-gnu"]="linux-x64"
            ["aarch64-unknown-linux-gnu"]="linux-arm64"
            ["x86_64-apple-darwin"]="darwin-x64"
            ["aarch64-apple-darwin"]="darwin-arm64"
          )

          for target in "${!TARGET_MAP[@]}"; do
            pkg_dir="npm/${TARGET_MAP[$target]}"
            mkdir -p "$pkg_dir/bin"

            # Copy binary
            cp "artifacts/server/server-$target/terminar-server" "$pkg_dir/bin/"
            chmod +x "$pkg_dir/bin/terminar-server"

            # Stamp version
            node -e "
              const pkg = require('./$pkg_dir/package.json');
              pkg.version = '$VERSION';
              require('fs').writeFileSync('./$pkg_dir/package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
          done

      - name: Assemble main package
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Copy tray build into app/
          mkdir -p npm/terminar/app
          cp -r artifacts/tray/dist npm/terminar/app/
          cp -r artifacts/tray/dist-electron npm/terminar/app/
          cp -r artifacts/tray/icons npm/terminar/app/
          cp artifacts/tray/package.json npm/terminar/app/

          # Stamp version in main package + optionalDependencies
          node -e "
            const pkg = require('./npm/terminar/package.json');
            pkg.version = '$VERSION';
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[dep] = '$VERSION';
            }
            require('fs').writeFileSync('./npm/terminar/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Make CLI executable
          chmod +x npm/terminar/bin/terminar.js

      - name: Upload assembled packages
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: npm/

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: assemble-npm
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download assembled packages
        uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: npm/

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg_dir in npm/darwin-arm64 npm/darwin-x64 npm/linux-x64 npm/linux-arm64; do
            echo "Publishing $(node -p "require('./$pkg_dir/package.json').name")..."
            cd "$pkg_dir"
            npm publish --access public || echo "Already published, skipping"
            cd -
          done

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm/terminar
          npm publish --access public

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-server, publish-npm]
    steps:
      - uses: actions/checkout@v4

      - name: Download all server artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
