appId: com.narai.terminar
productName: terminar
directories:
  buildResources: build
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - icons/**/*
extraResources:
  - from: "../server/target/release/terminar-server"
    to: "terminar-server"
mac:
  category: public.app-category.developer-tools
  icon: icons/icon.icns
  target:
    - target: dmg
      arch: [universal]
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  extraResources:
    - from: "../server/target/release/terminar-server"
      to: "terminar-server"
linux:
  category: Development
  icon: icons/icon.png
  target:
    - target: AppImage
    - target: deb
  extraResources:
    - from: "../server/target/release/terminar-server"
      to: "terminar-server"
win:
  target:
    - nsis
  extraResources:
    - from: "../server/target/release/terminar-server"
      to: "terminar-server"
