appId: com.narai.terminar
productName: terminar
directories:
  buildResources: build
  output: release
files:
  - dist/**/*
  - package.json

# Bundle the Rust server binary
extraResources:
  - from: ../server/target/release/terminar-server
    to: bin/terminar-server
    filter:
      - "!*.d"

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: msi
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: snap
      arch:
        - x64
  icon: build/icons
  category: Development
  maintainer: narai
  desktop:
    Name: terminar
    Comment: Persistent terminal sessions that survive restarts
    Categories: Development;TerminalEmulator;
    Keywords: terminal;shell;persistent;tmux;

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libpam0g

snap:
  stagePackages:
    - libpam0g

appImage:
  artifactName: ${productName}-${version}.${ext}

publish:
  provider: github
  releaseType: release
